name: Publish Update

on:
  workflow_dispatch:
    inputs:
      headline:
        description: 'Changelog headline (EN, one line per feature; shown outside the quote)'
        required: true
      sticker_id:
        description: 'Force update-popup sticker message-id in the metadata channel (empty = random from own icon pool 97-107; 108 in halloween season 10.10-3.11; e.g. 97 = turbo main)'
        required: false
      since_sha:
        description: 'Changelog base override: git sha the commit list starts from (use when the previous release was deleted and this one must carry its changelog; empty = since last successful publish run)'
        required: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.build_step.outputs.build_timestamp }}
      version_code: ${{ steps.build_step.outputs.version_code }}
      version_name: ${{ steps.build_step.outputs.version_name }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: "arm64-v8a,armeabi-v7a"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply media submodule patch
        run: git -C TMessagesProj_Modules/media apply "$GITHUB_WORKSPACE/docs/patches/0001-drop-legacy-kotlin-android-apply-for-AGP9-built-in-K.patch"
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        continue-on-error: true
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Configure Android SDK Path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: echo "$KEYSTORE" | base64 -d > TMessagesProj/nagramxturbo.jks
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo "$GOOGLE_SERVICES" | base64 -d > TMessagesProj/google-services.json
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Staging Build
        id: build_step
        env:
          COMMIT_ID: ${{ github.sha }}
          TURBO_BUILD_NUMBER: ${{ vars.TURBO_BUILD_NUMBER }}
        run: |
          if [ -z "$TURBO_BUILD_NUMBER" ]; then
            echo "::error::TURBO_BUILD_NUMBER repo variable is unset — failing closed to avoid version regression. Set: gh variable set TURBO_BUILD_NUMBER --body <N> -R temporaryna/NagramXTurbo"
            exit 1
          fi
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleRelease

          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' ! -name '*_base*' | head -1)
          APK_DIR=$(dirname "$APK")
          echo "APK=$APK_DIR" >> $GITHUB_ENV
          BADGING=$(${ANDROID_HOME}/build-tools/36.0.0/aapt2 dump badging "$APK")
          echo "version_code=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\).*/\1/p" | head -1)" >> "$GITHUB_OUTPUT"
          echo "version_name=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\).*/\1/p" | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PublishUpdate
          path: ${{ env.APK }}
      - name: Base Build
        env:
          COMMIT_ID: ${{ github.sha }}
          TURBO_BUILD_NUMBER: ${{ vars.TURBO_BUILD_NUMBER }}
          BUILD_TIMESTAMP: ${{ steps.build_step.outputs.build_timestamp }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./gradlew TMessagesProj:assembleRelease -PTURBO_BASE=1
      - uses: actions/upload-artifact@v4
        with:
          name: PublishUpdateBase
          path: ${{ env.APK }}/*_base*.apk

  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Prepare changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_HEADLINE: ${{ github.event.inputs.headline }}
          SINCE_SHA_INPUT: ${{ github.event.inputs.since_sha }}
        run: |
          set -e
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi
          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -n "$SINCE_SHA_INPUT" ] && echo "$SINCE_SHA_INPUT" | grep -qE '^[0-9a-f]{7,40}$'; then
            LAST_SHA="$SINCE_SHA_INPUT"
          else
            LAST_SHA=$(curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/publish-update.yml/runs?per_page=10" \
              | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // empty')
          fi
          COMMIT_TEXT=""
          if [ -n "$LAST_SHA" ]; then
            COMMIT_TEXT=$(curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA" \
              | jq -r '[.commits[].commit.message | split("\n")[0]] | join("\n")')
          fi
          if [ -z "$COMMIT_TEXT" ]; then
            COMMIT_TEXT="Bug fixes and improvements."
          fi
          {
            echo "changelog<<EOF"
            printf "What's new?\n\n%s\n" "$COMMIT_TEXT"
            echo "EOF"
            echo "release_notes<<EOF"
            if [ -n "$CHANGELOG_HEADLINE" ]; then
              printf "What's new?\n\n%s\n\n%s\n" "$CHANGELOG_HEADLINE" "$COMMIT_TEXT"
            else
              printf "What's new?\n\n%s\n" "$COMMIT_TEXT"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          HEAD_MSG=$(git log -1 --pretty=format:%B)
          {
            echo "commit_message<<EOF"
            echo "$HEAD_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes }}
        run: |
          printf '%s' "$RELEASE_NOTES" > /tmp/release_notes.md
          APK_ARM64=$(find artifacts -name '*arm64-v8a*.apk' ! -name '*_base*' | head -1)
          APK_ARMV7=$(find artifacts -name '*armeabi-v7a*.apk' ! -name '*_base*' | head -1)
          APK_BASE_ARM64=$(find artifacts -name '*_base*arm64-v8a*.apk' | head -1)
          APK_BASE_ARMV7=$(find artifacts -name '*_base*armeabi-v7a*.apk' | head -1)
          ASSETS=()
          for f in "$APK_ARM64" "$APK_ARMV7" "$APK_BASE_ARM64" "$APK_BASE_ARMV7"; do
            [ -n "$f" ] && ASSETS+=("$f")
          done
          gh release create "v$VERSION_NAME" "${ASSETS[@]}" \
            --title "$VERSION_NAME" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA"
          RELEASE_ASSETS=$(gh release view "v$VERSION_NAME" --json assets)
          ASSET_URL_ARM64=$(jq -r '[.assets[] | select(.name | contains("arm64-v8a") and (contains("_base") | not))][0].url // empty' <<< "$RELEASE_ASSETS")
          ASSET_URL_ARMV7=$(jq -r '[.assets[] | select(.name | contains("armeabi-v7a") and (contains("_base") | not))][0].url // empty' <<< "$RELEASE_ASSETS")
          ASSET_URL_BASE_ARM64=$(jq -r '[.assets[] | select(.name | contains("_base") and contains("arm64-v8a"))][0].url // empty' <<< "$RELEASE_ASSETS")
          ASSET_URL_BASE_ARMV7=$(jq -r '[.assets[] | select(.name | contains("_base") and contains("armeabi-v7a"))][0].url // empty' <<< "$RELEASE_ASSETS")
          echo "url=$ASSET_URL_ARM64" >> "$GITHUB_OUTPUT"
          echo "url_armv7=$ASSET_URL_ARMV7" >> "$GITHUB_OUTPUT"
          echo "url_base=$ASSET_URL_BASE_ARM64" >> "$GITHUB_OUTPUT"
          echo "url_base_armv7=$ASSET_URL_BASE_ARMV7" >> "$GITHUB_OUTPUT"
      - name: Publish to Telegram
        env:
          BUILD_TIMESTAMP: ${{ needs.build.outputs.build_timestamp }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          CHANGELOG_HEADLINE: ${{ github.event.inputs.headline }}
          COMMIT_ID: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ steps.changelog.outputs.commit_message }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_URL_ARMEABI_V7A: ${{ steps.release.outputs.url_armv7 }}
          RELEASE_URL_BASE: ${{ steps.release.outputs.url_base }}
          RELEASE_URL_BASE_ARMEABI_V7A: ${{ steps.release.outputs.url_base_armv7 }}
          STICKER_MESSAGE_ID: ${{ github.event.inputs.sticker_id }}
        run: |
          python Tools/scripts/upload.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_CANARY_TARGET }} manifest
          python Tools/scripts/upload.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_TARGET }} release
      - name: Bump build number
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          CURRENT: ${{ vars.TURBO_BUILD_NUMBER }}
          REPO: ${{ github.repository }}
        run: |
          NEXT=$((CURRENT + 1))
          gh api -X PATCH "repos/$REPO/actions/variables/TURBO_BUILD_NUMBER" -f name=TURBO_BUILD_NUMBER -f value="$NEXT"
          echo "TURBO_BUILD_NUMBER -> $NEXT"
