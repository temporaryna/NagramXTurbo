name: Staging build

on:
  workflow_dispatch:
    inputs:
      headline:
        description: 'Changelog headline (EN, one line per feature; shown outside the quote)'
        required: true
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.staging_build_step.outputs.build_timestamp }}
      version_name: ${{ steps.staging_build_step.outputs.version_name }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: "arm64-v8a,armeabi-v7a"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply media submodule patch
        run: git -C TMessagesProj_Modules/media apply "$GITHUB_WORKSPACE/docs/patches/0001-drop-legacy-kotlin-android-apply-for-AGP9-built-in-K.patch"
      - name: Create missing media3 consumer proguard files
        run: for m in container database decoder exoplayer_dash exoplayer_hls session effect muxer transformer; do touch "TMessagesProj_Modules/media/libraries/$m/proguard-rules.txt"; done
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: echo "$KEYSTORE" | base64 -d > TMessagesProj/nagramxturbo.jks
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo "$GOOGLE_SERVICES" | base64 -d > TMessagesProj/google-services.json
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Staging Build
        id: staging_build_step
        env:
          COMMIT_ID: ${{ github.sha }}
          TURBO_BUILD_NUMBER: ${{ vars.TURBO_BUILD_NUMBER }}
        run: |
          if [ -z "$TURBO_BUILD_NUMBER" ]; then
            echo "::error::TURBO_BUILD_NUMBER repo variable is unset — failing closed to avoid version regression. Set: gh variable set TURBO_BUILD_NUMBER --body <N> -R temporaryna/NagramXTurbo"
            exit 1
          fi
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Turbo build: T${TURBO_BUILD_NUMBER}"
          ./gradlew TMessagesProj:assembleStaging

          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' ! -name '*_base*' | head -1)
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
          APK_FILE=$(find "$APK" -name '*arm64-v8a*.apk' ! -name '*_base*' | head -1)
          BADGING=$(${ANDROID_HOME}/build-tools/36.0.0/aapt2 dump badging "$APK_FILE")
          echo "version_name=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\).*/\1/p" | head -1)" >> "$GITHUB_OUTPUT"
          python3 - "$APK_FILE" <<'PY'
          import struct, sys, zipfile
          thresholds = {"en": 10000, "it": 2000, "it_it": 2000, "es": 2000, "es_es": 2000}
          expected = ["en", "ar", "de", "es", "es_es", "fa_ir", "in_id", "it", "it_it",
                      "ja_jp", "ko", "nl", "pl_pl", "pt_br", "ru_ru", "tr_tr", "uk_ua",
                      "vi_vn", "zh_cn", "zh_tw"]
          with zipfile.ZipFile(sys.argv[1]) as z:
              failures = []
              for loc in expected:
                  name = f"assets/localization_{loc}.bin"
                  try:
                      count = struct.unpack("<i", z.read(name)[:4])[0]
                  except (KeyError, struct.error):
                      failures.append(f"{name}: missing or corrupt")
                      continue
                  minimum = thresholds.get(loc, 500)
                  if count < minimum:
                      failures.append(f"{name}: {count} entries < {minimum}")
              if failures:
                  print("::error::Localization binaries degraded: " + "; ".join(failures))
                  sys.exit(1)
              print("Localization binaries OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Staging
          path: ${{ env.APK }}
      - name: Staging Base Build
        if: github.event.inputs.upload != 'y'
        env:
          COMMIT_ID: ${{ github.sha }}
          TURBO_BUILD_NUMBER: ${{ vars.TURBO_BUILD_NUMBER }}
          BUILD_TIMESTAMP: ${{ steps.staging_build_step.outputs.build_timestamp }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./gradlew TMessagesProj:assembleStaging -PTURBO_BASE=1
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.upload != 'y'
        with:
          name: StagingBase
          path: ${{ env.APK }}/*_base*.apk
  upload:
    name: Upload staging
    if: github.event.inputs.upload != 'y'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Prepare changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi
          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.sha }}"
          LAST_SHA=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/staging.yml/runs?per_page=10" \
            | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // empty')
          SUBJECTS=""
          if [ -n "$LAST_SHA" ]; then
            SUBJECTS=$(curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA" \
              | jq -r '[.commits[].commit.message | split("\n")[0]] | join("\n")')
          fi
          if [ -z "$SUBJECTS" ]; then
            SUBJECTS="Bug fixes and improvements."
          fi
          {
            echo "changelog<<EOF"
            printf "What's new?\n\n%s\n" "$SUBJECTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare commit summary
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_MSG="$(git log -1 --pretty=%B)"
          set -e
          AI_SUMMARY_ENABLED="${{ vars.AI_SUMMARY_ENABLED }}"
          if [ "$AI_SUMMARY_ENABLED" != "true" ] && [ "$AI_SUMMARY_ENABLED" != "TRUE" ]; then
            echo "AI summary is disabled; skipping."
            echo "ai_summary<<EOF" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.sha }}"

          LAST_SHA=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/staging.yml/runs?status=completed&conclusion=success&branch=$BRANCH&per_page=1" | jq -r '.workflow_runs[0].head_sha // empty')

          COMMIT_TEXT=""
          TOTAL_COMMITS=0
          if [ -n "$LAST_SHA" ]; then
            COMPARE=$(curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA")
            TOTAL_COMMITS=$(echo "$COMPARE" | jq -r '.total_commits // 0')
            COMMIT_TEXT=$(echo "$COMPARE" | jq -r '[.commits[].commit.message] | join("\n\n")')
          fi

          if [ -z "$COMMIT_TEXT" ]; then
            COMMIT_TEXT="$HEAD_MSG"
          fi

          if [ "$TOTAL_COMMITS" -lt 3 ]; then
            echo "Found $TOTAL_COMMITS commits since last build; skipping AI summary."
            echo "ai_summary<<EOF" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          MODEL_ID="${{ vars.AI_MODEL }}"
          if [ -z "$MODEL_ID" ]; then
            MODEL_ID="openai/gpt-4o"
          fi

          PROMPT=$(cat << 'EOP'
          Please summarize the Git commit messages between the last CI build and the current build using Telegram HTML formatting (not Markdown):
          - Output strictly valid HTML supported by Telegram Bot API (e.g., <b>, <i>, <u>, <s>, <code>, <pre>, <a href="...">, <blockquote>, <br>).
          - Do NOT use Markdown, code fences, or backticks. No triple backticks.
          - Group by type with HTML headers: <b>✨ Features</b>, <b>🐛 Fixes</b>, <b>♻️ Refactors</b>, <b>⚠️ Breaking Changes</b>, <b>🧹 Others</b>.
          - Put exactly one blank line between each header section (i.e., one empty line between headers and their following section).
          - Under each header, use lines separated by <br> and start each item with • (bullet), keep each item one line, max 20 total items across all sections.
          - Escape any &, <, > characters from commit messages as &amp;, &lt;, &gt;.
          - Aggressively ignore trivial commits (merge commits, formatting, chore/version bumps, bump-deps, docs-only). Only surface user-facing changes, bug fixes, refactors affecting behavior, or notable internal changes.
          Here are the commit messages:
          EOP
          )
          CONTENT="$PROMPT\n$COMMIT_TEXT"
          PAYLOAD=$(jq -n --arg content "$CONTENT" --arg model "$MODEL_ID" '{messages:[{role:"user",content:$content}],model:$model}')

          RAW_RESPONSE=$(curl -s "https://models.github.ai/inference/chat/completions" \
             -H "Content-Type: application/json" \
             -H "Authorization: Bearer $GITHUB_TOKEN" \
             -d "$PAYLOAD")

          SUMMARY=$(echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content // empty')

          COMBINED=""
          if [ -n "$SUMMARY" ]; then
            COMBINED="Changes since last build:\n\n$SUMMARY"
          fi

          if [ -n "$LAST_SHA" ]; then
            DIFF_URL="https://github.com/$REPO/compare/$LAST_SHA...$HEAD_SHA"
          else
            DIFF_URL="https://github.com/$REPO/commit/$HEAD_SHA"
          fi

          COMBINED="$COMBINED\n\n<a href=\"$DIFF_URL\"><b>Full changes</b></a>\n\nGenerated by $MODEL_ID"

          echo "ai_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$COMBINED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Publish staging GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_ARM64=$(find artifacts -name '*arm64-v8a*.apk' ! -name '*_base*' | head -1)
          APK_ARMV7=$(find artifacts -name '*armeabi-v7a*.apk' ! -name '*_base*' | head -1)
          APK_BASE_ARM64=$(find artifacts -name '*_base*arm64-v8a*.apk' | head -1)
          APK_BASE_ARMV7=$(find artifacts -name '*_base*armeabi-v7a*.apk' | head -1)
          ASSETS=()
          for f in "$APK_ARM64" "$APK_ARMV7" "$APK_BASE_ARM64" "$APK_BASE_ARMV7"; do
            [ -n "$f" ] && ASSETS+=("$f")
          done
          if gh release view staging >/dev/null 2>&1; then
            gh release upload staging "${ASSETS[@]}"
          else
            gh release create staging "${ASSETS[@]}" --title "Staging" --notes "Latest staging build" --prerelease --target "$GITHUB_SHA"
          fi
          RELEASE_ASSETS=$(gh release view staging --json assets)
          ASSET_URL_ARM64=$(jq -r '[.assets[] | select(.name | contains("arm64-v8a") and (contains("_base") | not))] | max_by(.createdAt) | .url // empty' <<< "$RELEASE_ASSETS")
          ASSET_URL_ARMV7=$(jq -r '[.assets[] | select(.name | contains("armeabi-v7a") and (contains("_base") | not))] | max_by(.createdAt) | .url // empty' <<< "$RELEASE_ASSETS")
          ASSET_URL_BASE_ARM64=$(jq -r '[.assets[] | select(.name | contains("_base") and contains("arm64-v8a"))] | max_by(.createdAt) | .url // empty' <<< "$RELEASE_ASSETS")
          ASSET_URL_BASE_ARMV7=$(jq -r '[.assets[] | select(.name | contains("_base") and contains("armeabi-v7a"))] | max_by(.createdAt) | .url // empty' <<< "$RELEASE_ASSETS")
          echo "url=$ASSET_URL_ARM64" >> "$GITHUB_OUTPUT"
          echo "url_armv7=$ASSET_URL_ARMV7" >> "$GITHUB_OUTPUT"
          echo "url_base=$ASSET_URL_BASE_ARM64" >> "$GITHUB_OUTPUT"
          echo "url_base_armv7=$ASSET_URL_BASE_ARMV7" >> "$GITHUB_OUTPUT"
      - name: Head commit info
        run: echo "head_commit_subject=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"
      - name: Send to Telegram
        env:
          COMMIT_ID: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ env.head_commit_subject }}
          BUILD_TIMESTAMP: ${{ needs.build.outputs.build_timestamp }}
          AI_SUMMARY: ${{ steps.prepare.outputs.ai_summary }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_URL_ARMEABI_V7A: ${{ steps.release.outputs.url_armv7 }}
          RELEASE_URL_BASE: ${{ steps.release.outputs.url_base }}
          RELEASE_URL_BASE_ARMEABI_V7A: ${{ steps.release.outputs.url_base_armv7 }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          CHANGELOG_HEADLINE: ${{ github.event.inputs.headline }}
        run: |
          python Tools/scripts/upload.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_TARGET }} test
      - name: Bump build number
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          CURRENT: ${{ vars.TURBO_BUILD_NUMBER }}
          REPO: ${{ github.repository }}
        run: |
          NEXT=$((CURRENT + 1))
          gh api -X PATCH "repos/$REPO/actions/variables/TURBO_BUILD_NUMBER" -f name=TURBO_BUILD_NUMBER -f value="$NEXT"
          echo "TURBO_BUILD_NUMBER -> $NEXT"
